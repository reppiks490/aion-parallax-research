name: AION / PARALLAX assurance

on:
  push:
    branches: [main]
    paths:
      - "aion/**"
      - "contracts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/parallax-tests.yml"
  pull_request:
    paths:
      - "aion/**"
      - "contracts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/parallax-tests.yml"
  merge_group:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    if: github.event_name != 'schedule'
    name: Unit / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile all Python
        run: python -m compileall -q aion tests
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

  contracts-and-cockpit:
    if: github.event_name != 'schedule'
    name: Contracts + cockpit syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("contracts").glob("*.json"))
          if not files:
              raise SystemExit("no JSON contracts found")
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"validated {path}")
          PY
      - name: Validate cockpit JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("aion/cockpit.html").read_text(encoding="utf-8")
          scripts = [
              body for body in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
              if body.strip()
          ]
          if not scripts:
              raise SystemExit("no inline cockpit JavaScript found")
          for index, body in enumerate(scripts):
              out = Path(f"/tmp/aion-cockpit-{index}.js")
              out.write_text(body, encoding="utf-8")
              print(out)
          PY
          for script in /tmp/aion-cockpit-*.js; do
            node --check "$script"
          done

  synthetic-replay:
    if: github.event_name != 'schedule'
    name: Synthetic replay + evidence firewall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Build and verify isolated synthetic replay
        run: |
          rm -rf .ci-aion
          mkdir -p .ci-aion
          python -m aion.cli --db .ci-aion/replay.sqlite3 demo | tee .ci-aion/demo.log
          python -m aion.cli --db .ci-aion/replay.sqlite3 verify | tee .ci-aion/verify.log
          python -m aion.cli --db .ci-aion/replay.sqlite3 timeline > .ci-aion/timeline.log
          python -m aion.cli --db .ci-aion/replay.sqlite3 predictions > .ci-aion/predictions.log
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aion-synthetic-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-aion/
          if-no-files-found: ignore
          retention-days: 7

  package:
    if: github.event_name != 'schedule'
    name: Build + installed CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install wheel and verify dependency graph
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          aion --help
      - name: Preserve package evidence
        uses: actions/upload-artifact@v4
        with:
          name: aion-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  scheduled-drift:
    if: github.event_name == 'schedule'
    name: Daily deterministic drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile, test, contracts, cockpit, replay
        run: |
          python -m compileall -q aion tests
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("contracts").glob("*.json"))
          if not files:
              raise SystemExit("no JSON contracts found")
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("aion/cockpit.html").read_text(encoding="utf-8")
          scripts = [x for x in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S) if x.strip()]
          if not scripts:
              raise SystemExit("no inline cockpit JavaScript found")
          for i, body in enumerate(scripts):
              Path(f"/tmp/aion-cockpit-{i}.js").write_text(body, encoding="utf-8")
          PY
          for script in /tmp/aion-cockpit-*.js; do node --check "$script"; done
          rm -rf .ci-aion
          python -m aion.cli --db .ci-aion.sqlite3 demo
          python -m aion.cli --db .ci-aion.sqlite3 verify

  assurance:
    if: always() && github.event_name != 'schedule'
    name: Assurance gate + evidence
    needs: [unit, contracts-and-cockpit, synthetic-replay, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit machine-readable assurance evidence
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts-and-cockpit.result }}
          REPLAY: ${{ needs.synthetic-replay.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {
              "unit": os.environ["UNIT"],
              "contracts_and_cockpit": os.environ["CONTRACTS"],
              "synthetic_replay": os.environ["REPLAY"],
              "package": os.environ["PACKAGE"],
          }
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "read_only_research",
              "execution_allowed": False,
              "gates": gates,
              "result": "success" if all(v == "success" for v in gates.values()) else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require all gates
        env:
          UNIT: ${{ needs.unit.result }}
          CONTRACTS: ${{ needs.contracts-and-cockpit.result }}
          REPLAY: ${{ needs.synthetic-replay.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          printf 'unit=%s\ncontracts=%s\nreplay=%s\npackage=%s\n' "$UNIT" "$CONTRACTS" "$REPLAY" "$PACKAGE"
          test "$UNIT" = success
          test "$CONTRACTS" = success
          test "$REPLAY" = success
          test "$PACKAGE" = success

  scheduled-assurance:
    if: always() && github.event_name == 'schedule'
    name: Scheduled assurance gate + evidence
    needs: [scheduled-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit scheduled assurance evidence
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {"scheduled_drift": os.environ["DRIFT"]}
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "read_only_research",
              "execution_allowed": False,
              "gates": gates,
              "result": "success" if os.environ["DRIFT"] == "success" else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
      - name: Upload scheduled assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-scheduled-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require drift check
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: test "$DRIFT" = success
