name: PARALLAX tests

on:
  push:
    branches: [main]
    paths:
      - "aion/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/parallax-tests.yml"
  pull_request:
    paths:
      - "aion/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/parallax-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run PARALLAX tests
        run: python -m unittest discover -s tests -v
